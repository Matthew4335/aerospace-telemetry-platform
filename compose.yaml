services:

  # ------------------------------------
  # POSTGRESQL DATABASE
  # ------------------------------------
  db:
    image: postgres:18

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}

    volumes:
      - telemetry_pgdata:/var/lib/postgresql
      - ./database/docker_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/anomalies.sql:/docker-entrypoint-initdb.d/02-anomalies.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ------------------------------------
  # FASTAPI BACKEND
  # ------------------------------------
  api:
    build: .

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"

    depends_on:
      db:
        condition: service_healthy

  # ------------------------------------
  # ETL PIPELINE (RUN ON DEMAND)
  # ------------------------------------
  etl:
    build: .

    profiles:
      - tools

    command:
      - python
      - etl/load_telemetry.py

    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"

    volumes:
      - ./data:/app/data

    depends_on:
      db:
        condition: service_healthy

  ml:
    build: .

    profiles:
      - tools

    command:
      - python
      - -m
      - ml.detect_anomalies

    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api

    ports:
      - "127.0.0.1:8080:80"

    depends_on:
      - api

    restart: unless-stopped

# ------------------------------------
# PERSISTENT DATABASE STORAGE
# ------------------------------------
volumes:
  telemetry_pgdata:
